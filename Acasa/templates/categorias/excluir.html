{% extends 'base.html' %}

{% block content %}
    <section class="section">
        <h1>Excluir categoria</h1>
        <p>Tem certeza que deseja excluir a categoria <strong>{{ categoria.nome }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">Confirmar exclusao</button>
            <a href="{% url 'detalhar_categoria' categoria.id %}" class="button-link secondary">Cancelar</a>
        </form>
    </section>
{% endblock %}
